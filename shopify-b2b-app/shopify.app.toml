# Shopify app configuration.
#
# `client_id` is filled in by `shopify app config link` (or on the first
# `shopify app dev`) — leave the placeholder until then rather than inventing
# a value, or the CLI will link to an app that does not exist.
name = "B2B rekvizitai"
handle = "b2b-rekvizitai"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://example.com"
embedded = true

[access_scopes]
# The checkout extension reads and writes only checkout state, which needs no
# Admin API scopes. Add scopes here if an admin surface is added later.
scopes = ""

[auth]
redirect_urls = ["https://example.com/api/auth"]

[webhooks]
api_version = "2025-01"

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
